name: Regression gate

on:
  workflow_dispatch:
    inputs:
      baselineWorkflowRunId:
        description: ID da execução do GitHub Actions que publicou o artifact do baseline
        required: true
        type: string
      baselineRunId:
        description: ID do run de baseline do PromptBench
        required: true
        type: string
      candidateWorkflowRunId:
        description: ID da execução do GitHub Actions que publicou o artifact do candidate
        required: true
        type: string
      candidateRunId:
        description: ID do run de candidate do PromptBench
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  regression-gate:
    name: Validar regressões
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore PromptBench.slnx

      - name: Compilar solução
        run: dotnet build PromptBench.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test PromptBench.slnx --configuration Release --no-build --no-restore

      - name: Baixar run de baseline
        uses: actions/download-artifact@v5
        with:
          name: promptbench-run-${{ inputs.baselineRunId }}
          path: .artifacts/baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baselineWorkflowRunId }}

      - name: Baixar run de candidate
        uses: actions/download-artifact@v5
        with:
          name: promptbench-run-${{ inputs.candidateRunId }}
          path: .artifacts/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidateWorkflowRunId }}

      - name: Localizar arquivos dos runs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' baseline_files < <(find .artifacts/baseline -type f -name '*.json' -print0)
          mapfile -d '' candidate_files < <(find .artifacts/candidate -type f -name '*.json' -print0)

          if (( ${#baseline_files[@]} != 1 )); then
            echo "O artifact do baseline deve conter exatamente um arquivo JSON."
            exit 2
          fi

          if (( ${#candidate_files[@]} != 1 )); then
            echo "O artifact do candidate deve conter exatamente um arquivo JSON."
            exit 2
          fi

          cp -- "${baseline_files[0]}" .artifacts/baseline.json
          cp -- "${candidate_files[0]}" .artifacts/candidate.json

      - name: Executar regression gate
        shell: bash
        env:
          EXPECTED_BASELINE_ID: ${{ inputs.baselineRunId }}
          EXPECTED_CANDIDATE_ID: ${{ inputs.candidateRunId }}
        run: |
          set -uo pipefail

          gate_json="$(dotnet run --project src/PromptBench.Cli \
            --configuration Release --no-build --no-restore -- regression-gate \
            --baseline-file .artifacts/baseline.json \
            --candidate-file .artifacts/candidate.json)"
          gate_exit=$?

          if (( gate_exit == 2 )); then
            echo "Resultado final: não foi possível executar o regression gate."
            exit 2
          fi

          if (( gate_exit != 0 && gate_exit != 1 )); then
            echo "O regression gate retornou um exit code inesperado: $gate_exit."
            exit "$gate_exit"
          fi

          if ! jq -e . >/dev/null 2>&1 <<< "$gate_json"; then
            echo "O regression gate não retornou um JSON válido."
            exit 2
          fi

          returned_baseline_id="$(jq -r '.baselineId' <<< "$gate_json")"
          returned_candidate_id="$(jq -r '.candidateId' <<< "$gate_json")"
          if [[ "$returned_baseline_id" != "$EXPECTED_BASELINE_ID" ]]; then
            echo "O artifact do baseline contém um run diferente do ID informado."
            exit 2
          fi
          if [[ "$returned_candidate_id" != "$EXPECTED_CANDIDATE_ID" ]]; then
            echo "O artifact do candidate contém um run diferente do ID informado."
            exit 2
          fi

          echo "Resultado retornado pelo regression gate:"
          jq . <<< "$gate_json"

          regressions="$(jq -r '.regressions' <<< "$gate_json")"
          echo "Quantidade de regressões: $regressions"

          mapfile -t regression_cases < <(jq -r '.regressionCaseIds[]' <<< "$gate_json")
          if (( ${#regression_cases[@]} > 0 )); then
            echo "Casos com regressão:"
            printf '  - %s\n' "${regression_cases[@]}"
          fi

          if (( gate_exit == 0 )); then
            echo "Resultado final: gate aprovado."
          else
            echo "Resultado final: gate reprovado."
          fi

          exit "$gate_exit"
